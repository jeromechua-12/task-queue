services:
  redis:
    image: redis:8.8.0-alpine
    container_name: task-queue-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--askpass", "${REDIS_PASSWORD}", "ping"]
      interval: 30s 
      timeout: 10s
      retries: 3
      start_period: 30s 
      start_interval: 5s

volumes:
  redis-data:
    driver: local
